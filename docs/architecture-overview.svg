  </text>

  <rect x="58" y="304" width="426" height="66" rx="10" fill="#172554" stroke="#3b82f6"/>
  <text x="76" y="330" fill="#eff6ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">
    Edge Function · verify-license/index.ts
  </text>
  <text x="76" y="352" fill="#93c5fd" font-family="ui-monospace, monospace" font-size="11.5">
