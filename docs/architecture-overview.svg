  </text>

  <rect x="636" y="242" width="426" height="62" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="654" y="268" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="14" font-weight="600">
