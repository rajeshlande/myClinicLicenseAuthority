  </text>

  <!-- Center Connector -->
  <line x1="506" y1="242" x2="614" y2="242" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6 4"/>
  <polygon points="614,242 604,236 604,248" fill="#10b981"/>
  <rect x="515" y="196" width="90" height="34" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="560" y="211" text-anchor="middle" fill="#ecfdf5" font-family="ui-monospace, monospace" font-size="10" font-weight="700">HTTPS SYNC</text>
  <text x="560" y="224" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="9.5">Every 6h Cron</text>

  <!-- Right Zone: Web App 2 (Clinic Host) -->
  <rect x="614" y="96" width="470" height="292" rx="14" fill="url(#cardClinic)" stroke="#10b981" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="636" y="126" fill="#34d399" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="1">
