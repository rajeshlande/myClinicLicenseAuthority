  </text>

  <!-- Left Zone: Web App 1 (Vendor Cloud) -->
  <rect x="36" y="96" width="470" height="292" rx="14" fill="url(#cardVendor)" stroke="#3b82f6" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="58" y="126" fill="#60a5fa" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="1">
    WEB APP 1 · VENDOR CONTROL PLANE (CLOUD)
  </text>

  <rect x="58" y="144" width="426" height="66" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="76" y="170" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="14" font-weight="600">
    React 19 Control Room SPA (GitHub Pages / Vite 8)
  </text>
  <text x="76" y="192" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11.5">
    #/dashboard · #/simulator · #/node-agent · #/setup
  </text>

  <rect x="58" y="224" width="426" height="66" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="76" y="250" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="14" font-weight="600">
