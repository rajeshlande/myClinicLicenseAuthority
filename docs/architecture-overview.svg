<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" role="img" aria-label="myClinic License Authority and On-Premises myClinic RS256 Architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardVendor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#0c1324"/>
    </linearGradient>
    <linearGradient id="cardClinic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c2420"/>
      <stop offset="100%" stop-color="#091917"/>
    </linearGradient>
  </defs>

  <rect width="1120" height="420" rx="20" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <text x="44" y="48" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">
    myClinic License Authority · Asymmetric RS256 Phone-Home Architecture
  </text>
  <text x="44" y="72" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">
