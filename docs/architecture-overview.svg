  </text>

  <rect x="636" y="144" width="426" height="82" rx="10" fill="#064e3b" stroke="#10b981"/>
  <text x="654" y="170" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="14" font-weight="600">
