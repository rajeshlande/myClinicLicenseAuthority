  </text>

  <rect x="636" y="318" width="426" height="52" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="654" y="341" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600">
