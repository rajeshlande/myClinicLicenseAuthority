name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} · tests + build + audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: |
          node -v
          npm -v
          npm ci --no-audit --no-fund

      - name: Unit & cryptographic tests
        run: npm test

      - name: Build (relative base)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: GitHub Pages readiness
        run: npm run check:pages

      - name: Admin static ratchet (§12.1 item 1 · §13.3)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: npm run check:admin-static

      - name: Write-verify ratchet (§14 operator honesty · P8d)
        # Every privileged write must count the rows it changed: Central's RLS refuses a
        # non-admin SILENTLY on UPDATE/DELETE (0 rows, no exception), so an unverified
        # chain reports success for a write that never happened. Scans src/ only, needs
        # no env and no build output, so it cannot be skipped for want of a secret.
        run: npm run check:write-verify

      - name: Build from a repository sub-path
        run: VITE_BASE=/myclinic-license-authority/ npm run build && VITE_BASE=/myclinic-license-authority/ npm run check:pages

      - name: Contributing & skill standards
        run: npm run check:contributing

      - name: Security checklist
        run: npm run test:security

      - name: Dependency audit (high+)
        run: npm audit --audit-level=high
